name: Build elish OC Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        path: kernel
        fetch-depth: 1

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq bc bison flex libssl-dev libncurses5-dev \
          build-essential cpio gzip curl wget git zip libelf-dev 2>&1 | tail -2

    - name: Clone Proton Clang 12
      run: |
        git clone --depth 1 https://github.com/kdrag0n/proton-clang.git toolchain
        toolchain/bin/clang --version | head -2

    - name: Build
      working-directory: kernel
      run: |
        set +e
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        export ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        mkdir -p out
        echo "=== OC patch: $(grep -c 'OC patch' drivers/gpu/msm/kgsl_gmu.c) ==="
        cp arch/arm64/configs/vendor/kona_defconfig out/.config
        # 关 focaltech（WIP 状态）+ 关 FTRACE（Clang+LLD 的 __mcount_loc 重定位不支持）
        ./scripts/config --file out/.config \
          -d TOUCHSCREEN_FTS -d TOUCHSCREEN_FOCALTECH \
          -d FTRACE -d FUNCTION_TRACER -d DYNAMIC_FTRACE \
          -d FUNCTION_GRAPH_TRACER -d STACK_TRACER \
          -d FTRACE_SYSCALLS -d SCHED_TRACER -d IRQSOFF_TRACER \
          -d PREEMPT_TRACER -d HWLAT_TRACER -d MMIOTRACE \
          -d TRACER_SNAPSHOT -d UPROBE_EVENTS -d KPROBE_EVENTS \
          -d FTRACE_MCOUNT_RECORD -d HAVE_FTRACE_MCOUNT_RECORD 2>&1 | tail -2
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig > /tmp/cfg.log 2>&1
        echo "olddefconfig_rc=$?"
        make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          Image.gz > /tmp/build.log 2>&1
        echo "BUILD_RC=$?"
        echo "=== errors ==="
        grep -E "error:|Error [0-9]|fatal|dangerous relocation" /tmp/build.log | head -15
        mkdir -p ../package
        cp /tmp/build.log /tmp/cfg.log ../package/ 2>/dev/null
        cp out/arch/arm64/boot/Image.gz ../package/ 2>/dev/null
        cp out/arch/arm64/boot/Image ../package/ 2>/dev/null
        cp out/.config ../package/built.config 2>/dev/null
        ls -lah ../package/
        exit 0

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: elish-oc
        path: package/
        if-no-files-found: warn
